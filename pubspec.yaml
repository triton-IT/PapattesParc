name: papatte_parc
description: Jeu de déduction Papatte Parc, porté de Unity vers Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/park_map.png
    - assets/level_art/
    - assets/animal_markers/
    - assets/match3/
    - assets/match3/animals/
    - assets/mahjong/
    - assets/solitaire/
    - assets/sokoban/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
