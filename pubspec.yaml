name: papatte_parc
description: Huit jeux de réflexion et de patience dans un parc animalier illustré.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: 1.0.9
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  web: 1.1.1
  meta: ^1.18.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/optimized/
    - assets/optimized/level_art/
    - assets/optimized/animal_markers/
    - assets/optimized/match3/
    - assets/optimized/match3/animals/
    - assets/optimized/mahjong/
    - assets/optimized/solitaire/
    - assets/optimized/sokoban/
    - assets/optimized/food_sort/
    - assets/optimized/food_sort/ui/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
